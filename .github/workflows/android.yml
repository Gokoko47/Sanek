name: Pakostnik Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pakostnik-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Check own Telegram credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[1-9][0-9]{0,9}', os.environ.get('TG_API_ID','')), 'Add TG_API_ID repository secret'
          assert re.fullmatch(r'[a-fA-F0-9]{32}', os.environ.get('TG_API_HASH','')), 'Add TG_API_HASH repository secret'
          PY
      - name: Download pinned Telegram and apply Pakostnik
        run: bash bootstrap.sh
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check gateway and safeguards
        run: python3 -m unittest discover -s tests -v
      - name: Optional stable private signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            python3 - <<'PYCODE'
          import os, base64
          from pathlib import Path
          Path('Telegram/TMessagesProj/config/release.keystore').write_bytes(base64.b64decode(os.environ['SIGNING_KEYSTORE_BASE64'], validate=True))
          PYCODE
          fi
      - name: Build debug APK
        working-directory: Telegram
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          bash gradlew :TMessagesProj_AppStandalone:assembleAfatDebug --no-daemon --max-workers=2
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pakostnik-ai-debug-apk
          path: Telegram/TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
