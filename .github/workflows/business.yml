name: Telegram Business bot checks
on:
  push:
    branches: [main]
    paths: ['business/**', 'railway.toml', '.dockerignore', '.github/workflows/business.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate worker configuration
        run: |
          python - <<'PYCODE'
          import tomllib
          from pathlib import Path
          config=tomllib.loads(Path('railway.toml').read_text())
          assert config['deploy']['numReplicas']==1
          assert Path(config['build']['dockerfilePath']).is_file()
          PYCODE
      - run: python -m unittest discover -s business/tests -v
