name: Telegram Business bot checks
on:
  push:
    branches: [main]
    paths: ['business/**', '.github/workflows/business.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s business/tests -v
