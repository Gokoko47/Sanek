plugins { id 'com.android.application' }
android {
    namespace 'ai.pakostnik.demo'
    compileSdk 35
    defaultConfig {
        applicationId 'ai.pakostnik.demo'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-demo'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.java.srcDir(layout.buildDirectory.dir('generated/palette'))
}
tasks.register('preparePalette', Copy) {
    from('../../overlay/TMessagesProj/src/main/java/org/telegram/messenger/pakostnik') {
        include 'ConsolePalette.java'
    }
    into(layout.buildDirectory.dir('generated/palette/org/telegram/messenger/pakostnik'))
}
tasks.named('preBuild').configure { dependsOn 'preparePalette' }
