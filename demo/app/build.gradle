plugins { id 'com.android.application' }
android {
    namespace 'ai.pakostnik.demo'
    compileSdk 35
    defaultConfig {
        applicationId 'ai.pakostnik.demo'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-demo'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.java {
        srcDirs = ['src/main/java', '../../overlay/TMessagesProj/src/main/java']
        include 'ai/pakostnik/demo/**'
        include 'org/telegram/messenger/pakostnik/ConsolePalette.java'
    }
}
